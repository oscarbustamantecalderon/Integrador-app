# Nombre de la aplicación
spring.application.name=espera-digital

# Perfil predeterminado para desarrollo con H2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuración de PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurante}
spring.datasource.username=${DB_USERNAME:postgres}

# La contraseña se obtiene desde una variable de entorno
spring.datasource.password=${DB_PASSWORD:}

# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update

# Línea corregida: se eliminó la letra R
spring.jpa.show-sql=true

# Mostrar el SQL de manera ordenada
spring.jpa.properties.hibernate.format_sql=true